<main class="flex h-screen w-full flex-col overflow-hidden bg-white text-gray-900">

  <header class="h-10 border-b border-gray-200 relatoive z-10 ">
    <top-controls></top-controls>
       @if(!visible) {
      <button (click)="visible = !visible"
        class="absolute top-4 left-4 z-50 p-2 hover:bg-gray-300 rounded-md border border-gray-200 bg-gray-400">
        <i clss="pi pi-arrow-right"></i>
      </button>
    }
  </header>


  <div class="flex flex-1 overflow-hidden mt-8 ">
    <aside [class.w-64]="visible" [class.w-0]="!visible" [class.border-r]="visible" class="flex-none transition-all duartion ease-in-out overflow-hidden">

      <div class="w-64">
        <div class="flex items-center justify-between p-4">
          <span class="text-sm font-bold">Menu</span>
          <button (click)="visible = false" class="p-1 hover:bg-gray-200 rounded">
            <i class="pi pi-angle-left"></i>
          </button>
        </div>

        <nav-sidebar></nav-sidebar>
      </div>

    </aside>

 

    <section class="flex-1 relative overflow-hidden flex flex-col">
      <div class="flex-1 overflow-y-auto">
        <main-view></main-view>
      </div>
    </section>

    <aside [class.hidden]="!selectedEventId()" class="w-80 border-l border-gray-200 overflow-y-auto">
      <event-view></event-view>
    </aside>
  </div>
</main>



<router-outlet />
